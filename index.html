<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>SolKni · Получение аккаунта iOS</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 85% 15%,#460d16,transparent 50%),#10090d;color:#fff6f2;font:16px/1.55 system-ui}main{width:min(100%,520px);padding:32px;border:1px solid #66262c;border-radius:24px;background:#190f15;box-shadow:0 24px 80px #0008}header{font-weight:800;color:#ff777a}h1{line-height:1.12;margin:14px 0}p{color:#e1c9cd}a{display:inline-block;background:#af2939;color:#fff;text-decoration:none;padding:12px 18px;border-radius:10px;font-weight:700}a:focus-visible{outline:3px solid white;outline-offset:4px}a[hidden]{display:none}
</style>
<main>
<header>SolKni · Soul Knight</header>
<h1>Получение аккаунта iOS</h1>
<p id="status">Откройте уникальную ссылку, которую вы получили после оплаты на FunPay.</p>
<a id="continue" hidden rel="noreferrer">Перейти к получению</a>
<noscript><p>Для перехода к выдаче включите JavaScript.</p></noscript>
</main>
<script>
"use strict";
// Укажите HTTPS-адрес сервера выдачи БЕЗ пути и завершающего /.
const backend = "";
const token = location.hash.slice(1);
const status = document.getElementById("status");
const next = document.getElementById("continue");
if (/^[A-Za-z0-9_-]{43}$/.test(token)) {
  try {
    const origin = new URL(backend);
    if (origin.protocol !== "https:" || origin.origin !== backend) throw Error();
    next.href = new URL("/claim-ios/" + token, origin).href;
    next.hidden = false;
    status.textContent = "Продолжите на защищённой странице. Понадобится код из чата заказа на FunPay.";
  } catch {
    status.textContent = "Страница выдачи ещё не подключена. Обратитесь к продавцу в чате заказа на FunPay.";
  }
}
</script>
</html>
